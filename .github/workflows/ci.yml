name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      working-directory: Backend/BankManagementApp
      run: mvn clean package -DskipTests


    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: Backend/BankManagementApp/target/*.jar