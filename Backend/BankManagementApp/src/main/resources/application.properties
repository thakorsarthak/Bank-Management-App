
spring.config.import=optional:classpath:application-secret.properties

spring.application.name=BankManagementApp
spring.datasource.url=jdbc:mysql://localhost:3306/bankapp

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


#swagger server configure
server.servlet.context-path=/bankapp
server.port=60000
   
#spring.main.allow-circular-references=true

#spring security
#spring.security.user.name=sarthak
#spring.security.user.password=sarthak

# Email config
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.starttls.enable=true


# redis for session management and caching

spring.data.redis.host=localhost
spring.data.redis.port=16379
spring.data.redis.timeout=6000
spring.data.redis.database=0 

# rabbit message queue

spring.rabbitmq.host=localhost
spring.rabbitmq.port=15673
spring.rabbitmq.username=bank_user
spring.rabbitmq.password=bank_pass


file.upload.base-path=C:/bankapp-storage/uploads





