<p-toast></p-toast>

<div class="reset-container">
    <p-card header="Reset Password" [style]="{ width: '380px', 'box-shadow': '0 4px 24px rgba(0,0,0,0.10)' }">

        <form [formGroup]="resetForm" (ngSubmit)="onSubmitVerifyOtp()" class="reset-form">

            <div class="form-field">
                <label for="identifier">Email or Contact No.</label>
                <span class="p-input-icon-right w-full">
                    <i class="pi pi-user" style="padding-right: 10px;"></i>
                    <input id="identifier" type="text" pInputText formControlName="identifier"
                        placeholder="Enter your email or contact number" class="w-full" />
                </span>
            </div>

            <div class="form-field">
                <label for="otp">OTP</label>
                <span class="p-input-icon-right w-full">
                    <i class="pi pi-key" style="padding-right: 10px;"></i>
                    <input id="otp" type="text" pInputText formControlName="otp" placeholder="Enter OTP" class="w-full"
                        maxlength="6" />
                </span>
            </div>

            <div class="form-actions">
                <p-button type="submit" label="Verify OTP" icon="pi pi-check" class="action-btn"
                   >
                </p-button>

                <p-button type="button" [label]="isOtpSent ? 'Resend OTP' : 'Send OTP'" icon="pi pi-refresh"
                    (click)="onSendOrResendOtp()" [disabled]="resetForm.get('identifier')?.invalid || resendDisabled">
                </p-button>
            </div>

            <div *ngIf="resendDisabled" class="resend-timer" style="margin-top: 10px;">
                You can resend OTP in <b>{{ timeLeftDisplay }}</b>
            </div>

        </form>
    </p-card>

    <p-dialog header="Set New PIN" [(visible)]="pinDialogVisible" [modal]="true" [closable]="false" [style]="{ width: '400px' }">
  <form [formGroup]="pinForm" (ngSubmit)="onPinSubmit()">
    <div class="p-fluid">
      <div class="p-field">
        <label for="newPin">New PIN</label>
        <input id="newPin" type="password" pInputText formControlName="newPin" />
        <small *ngIf="pinForm.get('newPin')?.invalid && pinForm.get('newPin')?.touched" class="p-error">
          PIN is required (4–8 digits).
        </small>
      </div>

      <div class="p-field">
        <label for="confirmPin">Confirm PIN</label>
        <input id="confirmPin" type="password" pInputText formControlName="confirmPin" />
        <small *ngIf="pinForm.hasError('notMatching') && pinForm.get('confirmPin')?.touched" class="p-error">
          PINs do not match.
        </small>
      </div>

      <button type="submit" pButton label="Verify & Set PIN" [disabled]="pinForm.invalid"></button>
    </div>
  </form>
</p-dialog>

</div>
