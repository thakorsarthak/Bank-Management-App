<div class="header">
  <p-menubar [model]="items">
    <ng-template pTemplate="start">
    <h1 class="logo" routerLink="/"
           routerlinkactive="active">SecureBank
      </h1>
    </ng-template>
    <ng-template pTemplate="end">
      <div class="flex gap-2">
        <p-button 
          label="Login" 
          icon="pi pi-sign-in" 
           routerLink="/login"
           routerlinkactive="active" 
          styleClass="p-button-text">
        </p-button>
        <p-button 
          label="Login" 
          label="Open Account"
           icon="pi pi-user-plus"
           routerLink="/openAccount"
           routerlinkactive="active" 
          styleClass="p-button-text">
        </p-button>
